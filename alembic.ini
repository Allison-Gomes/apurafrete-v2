# ---------------------------------------------------
# ARQUIVO : alembic.ini
# MODULO  : Infraestrutura / Migrations
# OBJETIVO: Configuracao principal do Alembic.
#           A URL real do banco NAO fica aqui - e lida
#           de settings.DATABASE_URL dentro de
#           alembic/env.py (evita duplicar segredo e
#           mantem .env como unica fonte de verdade).
# CRIADO  : 02/07/2026
# ---------------------------------------------------

[alembic]
script_location = alembic
prepend_sys_path = .
version_path_separator = os

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
